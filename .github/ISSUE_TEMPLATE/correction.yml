name: 記事の訂正
description: AlgoOps Noteの記事にある誤り（数値、記述、リンク切れなど）を知らせる
labels: ["correction"]
body:
  - type: input
    id: url
    attributes:
      label: 記事のURL
      placeholder: https://algo-ops-note.com/...
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 該当箇所
      description: 見出しや、誤っている文をそのまま貼り付けてください
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 誤りの内容と、正しいと考える内容
      description: 根拠となる資料があればURLを添えてください
    validations:
      required: true
